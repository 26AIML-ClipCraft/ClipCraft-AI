const { useState, useEffect, useRef, createContext, useContext } = React;

/* ── TWEAK DEFAULTS ── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#5B4CF5",
  "darkSidebar": false,
  "density": "compact"
}/*EDITMODE-END*/;

const ThemeCtx = createContext({ accent: "#5B4CF5", darkSidebar: false, density: "comfortable" });
const useTheme = () => useContext(ThemeCtx);

/* ── COLOR PALETTES ── */
const ACCENTS = [
{ name: "Indigo", hex: "#5B4CF5" },
{ name: "Coral", hex: "#E8522E" },
{ name: "Teal", hex: "#0BA896" },
{ name: "Violet", hex: "#8B3CF7" },
{ name: "Amber", hex: "#D4820A" },
{ name: "Rose", hex: "#E0285A" },
{ name: "Slate", hex: "#334155" },
{ name: "Forest", hex: "#1A7A4A" }];


/* ── TWEAKS PANEL ── */
const TweaksPanel = ({ tweaks, setTweaks, onClose }) => {
  const save = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };
  return (
    <div className="tweaks-panel">
      <div className="tweaks-header">
        <span className="tweaks-title">Tweaks</span>
        <button className="tweaks-close" onClick={() => {onClose();window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');}}>✕</button>
      </div>
      <div className="tweaks-section">
        <span className="tweaks-label">포인트 컬러</span>
        <div className="swatch-grid">
          {ACCENTS.map((c) =>
          <div key={c.hex} className={`swatch${tweaks.accent === c.hex ? ' active' : ''}`}
          style={{ background: c.hex }}
          onClick={() => save({ accent: c.hex })}
          title={c.name} />

          )}
        </div>
      </div>
      <div className="tweaks-section">
        <div className="toggle-row">
          <span className="tweaks-label" style={{ margin: 0 }}>다크 사이드바</span>
          <div className={`toggle-track${tweaks.darkSidebar ? ' on' : ''}`} onClick={() => save({ darkSidebar: !tweaks.darkSidebar })}>
            <div className="toggle-thumb" style={{ background: tweaks.darkSidebar ? tweaks.accent : '#fff' }} />
          </div>
        </div>
      </div>
      <div className="tweaks-section">
        <span className="tweaks-label">레이아웃 밀도</span>
        <div className="mode-row">
          {["compact", "comfortable", "spacious"].map((d) =>
          <button key={d} className={`mode-btn${tweaks.density === d ? ' active' : ''}`}
          style={tweaks.density === d ? { background: tweaks.accent, borderColor: tweaks.accent } : {}}
          onClick={() => save({ density: d })}>
              {d === "compact" ? "좁게" : d === "comfortable" ? "기본" : "넓게"}
            </button>
          )}
        </div>
      </div>
    </div>);

};

/* ── ICONS ── */

/* ── SHARED DATA: scenario suggestions + highlight candidates (full length 15:00 = 900s) ── */
const fmtSec = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

/* ── MONO LABEL ── */
const MonoLabel = ({ children, style = {} }) =>

  letterSpacing: "0.6px", textTransform: "uppercase", color: "rgba(0,0,0,0.38)",
  ...style
}}>{children}</span>;


/* ── PILL BUTTON ── */
const PillBtn = ({ children, variant = "black", onClick, icon, style = {}, small = false, accentOverride }) => {
  const { accent } = useTheme();
  const col = accentOverride || accent;
  const [hov, setHov] = useState(false);
  const base = {
    display: "inline-flex", alignItems: "center", gap: 7,
    padding: small ? "7px 16px" : "10px 22px",
    borderRadius: 50, border: "none", cursor: "pointer",
    fontSize: small ? 13 : 14.5, fontWeight: 480, letterSpacing: "-0.14px",
    fontFamily: "inherit", transition: "all 0.18s ease", whiteSpace: "nowrap", outline: "none"
  };
  const variants = {
    accent: { background: hov ? col + "dd" : col, color: "#fff" },
    black: { background: hov ? "#222" : "#000", color: "#fff" },
    white: { background: hov ? "#f5f5f5" : "#fff", color: "#000", boxShadow: "0 0 0 1px rgba(0,0,0,0.12)" },
    glass: { background: hov ? "rgba(0,0,0,0.09)" : "rgba(0,0,0,0.05)", color: "#000" }
  };
  return (
    <button onClick={onClick} style={{ ...base, ...variants[variant], ...style }}
    onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}>
      {icon && <Icon d={icons[icon]} size={14} />}
      {children}
    </button>);

};

/* ══════════════════════════════
   SCREEN 1.6: HIGHLIGHT RESULT (full video length)
══════════════════════════════ */
const HighlightResultScreen = ({ onBack, onRetry, onNext }) => {
  const { accent } = useTheme();
  const v0 = (() => { try { const n = parseInt(new URLSearchParams(location.search).get("v"), 10); return n >= 1 && n <= window.CC_DATA.length ? n - 1 : 0; } catch (e) { return 0; } })();
  const [vi, setVi] = useState(v0);
  const V = window.CC_DATA[vi];
  const HIGHLIGHTS = V.highlights, TOTAL_SEC = V.duration, WAVE = V.wave;
  const initSel = (v) => new Set(v.highlights.map(h => h.id));
  const [selected, setSelected] = useState(() => initSel(window.CC_DATA[v0]));
  const [activeId, setActiveId] = useState(HIGHLIGHTS[0].id);
  const sort = "time";
  const [pos, setPos] = useState(HIGHLIGHTS[0].s); // playhead, seconds
  const [playing, setPlaying] = useState(false);
  const [mode, setMode] = useState("orig"); // orig | summary
  const timelineRef = useRef(null);
  const videoRef = useRef(null);
  const encSrc = (f) => (f || "").split("/").map(encodeURIComponent).join("/");
  const switchVideo = (i) => {
    const v = window.CC_DATA[i];
    setVi(i); setMode("orig"); setSelected(initSel(v)); setActiveId(v.highlights[0].id); setPos(v.highlights[0].s); setPlaying(false);
  };

  const active = HIGHLIGHTS.find(h => h.id === activeId);
  const list = [...HIGHLIGHTS].sort((a, b) => sort === "score" ? b.score - a.score : a.s - b.s);
  const totalSel = HIGHLIGHTS.filter(h => selected.has(h.id)).reduce((t, h) => t + (h.e - h.s), 0);

  // Play the real video within the active highlight, then stop at its end
  const onTime = () => {
    const el = videoRef.current; if (!el || mode !== "orig") return;
    const t = el.currentTime; setPos(t);
    const hit = HIGHLIGHTS.find(x => t >= x.s && t <= x.e); if (hit && hit.id !== activeId) setActiveId(hit.id);
  };
  const togglePlay = () => {
    const el = videoRef.current; if (!el) return;
    if (el.paused) { el.play(); setPlaying(true); } else { el.pause(); setPlaying(false); }
  };

  const seekTo = (t) => { setPos(t); setPlaying(false); setMode('orig'); const el = videoRef.current; if (el) { el.pause(); try { el.currentTime = t; } catch (e) {} } window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const toggle = (id) => setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const focusHL = (h) => { setActiveId(h.id); setPos(h.s); setPlaying(false); setMode('orig'); const el = videoRef.current; if (el) { el.pause(); try { el.currentTime = h.s; } catch (e) {} } };
  const seek = (e) => {
    const r = timelineRef.current.getBoundingClientRect();
    const sec = Math.max(0, Math.min(TOTAL_SEC, ((e.clientX - r.left) / r.width) * TOTAL_SEC));
    setPos(sec); setPlaying(false); { const el = videoRef.current; if (el && mode === 'orig') { el.pause(); el.currentTime = sec; } }
    const hit = HIGHLIGHTS.find(h => sec >= h.s && sec <= h.e);
    if (hit) setActiveId(hit.id);
  };

        <h1 style={{ fontSize: 38, lineHeight: 1.1, letterSpacing: "-1.1px", fontWeight: 620, marginBottom: 10 }}>

        {/* LEFT: preview + full-length timeline */}
        <div style={{ border: "1px solid rgba(0,0,0,0.1)", borderRadius: 14, background: "#fff", padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{ position: "relative", width: "100%", aspectRatio: "16/9", borderRadius: 10, overflow: "hidden", background: "#000" }}>
            <video key={vi + mode} ref={videoRef} src={encSrc(V.video)} preload="metadata" playsInline
              onTimeUpdate={onTime} onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)} onEnded={() => setPlaying(false)} onLoadedMetadata={() => { const el = videoRef.current; if (el && mode === "orig") el.currentTime = pos; }}
              style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "contain", background: "#000" }} />
            <button type="button" aria-label={playing ? "일시정지" : "재생"} onClick={togglePlay}
              style={{ position: "absolute", left: "50%", top: "50%", transform: "translate(-50%,-50%)", width: 52, height: 52, borderRadius: "50%", border: "none", background: "rgba(255,255,255,0.92)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon d={playing ? icons.pause : icons.play} size={18} stroke="#000" fill="#000" />
            </button>
            <span style={{ position: "absolute", left: 12, bottom: 10, fontFamily: "'DM Mono', 'Noto Sans KR', monospace", fontSize: 11, color: "#fff", background: "rgba(0,0,0,0.55)", padding: "3px 8px", borderRadius: 4 }}>
              {fmtSec(pos)} / {fmtSec(TOTAL_SEC)}
            </span>
            <span style={{ position: "absolute", right: 12, top: 10, display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 540, color: "#fff", background: accent, padding: "3px 9px", borderRadius: 50 }}>
              <Icon d={icons.zap} size={10} stroke="#fff" strokeWidth={2} /> {active.label}
            </span>
          </div>

          {/* Timeline over the whole video length */}
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <MonoLabel>Full length timeline</MonoLabel>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 10, fontSize: 11, color: "rgba(0,0,0,0.45)" }}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: accent + "55", border: `1px solid ${accent}` }} />선택</span>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "rgba(0,0,0,0.06)", border: "1px dashed rgba(0,0,0,0.35)" }} />제외</span>
              </span>
            </div>
            <div style={{ border: "1px solid rgba(0,0,0,0.08)", borderRadius: 10, overflow: "hidden", background: "#fafafa" }}>
              <div style={{ position: "relative", height: 26, background: "#f4f4f4", borderBottom: "1px solid rgba(0,0,0,0.05)" }}>
                {HIGHLIGHTS.map(h => (
                  <button key={h.id} type="button" aria-label={`${h.label} 구간으로 이동`} onClick={() => focusHL(h)}
                    style={{ position: "absolute", top: "50%", left: `${((h.s + h.e) / 2 / TOTAL_SEC) * 100}%`, transform: "translate(-50%,-50%)", width: 17, height: 17, borderRadius: "50%", border: activeId === h.id ? "2px solid #000" : "none", padding: 0, cursor: "pointer", background: selected.has(h.id) ? accent : "rgba(0,0,0,0.25)", color: "#fff", fontSize: 8, fontFamily: "monospace", fontWeight: 700 }}>
                    {h.id}
                  </button>
                ))}
              </div>
              <div ref={timelineRef} onClick={seek} style={{ position: "relative", height: 64, display: "flex", alignItems: "center", padding: "4px 2px", cursor: "crosshair" }}>
                {WAVE.map((w, i) => (
                  <div key={i} style={{ flex: 1, height: Math.max(2, w * 0.5), borderRadius: 1, background: (i / WAVE.length) < pos / TOTAL_SEC ? accent + "bb" : "rgba(0,0,0,0.10)", position: "relative", zIndex: 1 }} />
                ))}
                {HIGHLIGHTS.map(h => {
                  const on = selected.has(h.id);
                  return (
                    <div key={h.id} style={{
                      position: "absolute", top: 0, bottom: 0, zIndex: 2, pointerEvents: "none",
                      left: `${(h.s / TOTAL_SEC) * 100}%`, width: `${((h.e - h.s) / TOTAL_SEC) * 100}%`,
                      background: on ? accent + "26" : "rgba(0,0,0,0.04)",
                      borderLeft: `2px ${on ? "solid" : "dashed"} ${on ? accent : "rgba(0,0,0,0.35)"}`,
                      outline: activeId === h.id ? `1.5px solid ${accent}` : "none", outlineOffset: -1.5
                    }} />
                  );
                })}
                <div style={{ position: "absolute", top: 0, bottom: 0, left: `${(pos / TOTAL_SEC) * 100}%`, width: 1.5, background: accent, zIndex: 4, pointerEvents: "none" }} />

            </div>

                  <img src={encSrc(h.thumb)} alt="" loading="lazy" style={{ width: 64, height: 40, flexShrink: 0, borderRadius: 6, objectFit: "cover", background: "#111" }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 480, letterSpacing: "-0.1px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{h.label}</div>
                    <div style={{ fontSize: 11, fontFamily: "'DM Mono', 'Noto Sans KR', monospace", color: "rgba(0,0,0,0.5)", marginTop: 2 }}>
                      {fmtSec(h.s)} – {fmtSec(h.e)} · {h.e - h.s}초
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          </div>
        </div>
      </div>


      {/* Recommended scenario (video summarization -> caption -> scenario) */}
      {V.scenario && (
        <div style={{ width: "100%", maxWidth: 960, marginTop: 16, border: "1px solid rgba(0,0,0,0.1)", borderRadius: 14, background: "#fff", padding: 20 }}>
          <MonoLabel style={{ display: "block", marginBottom: 10 }}>추천 시나리오 · {V.scenario.scenes.length}장면</MonoLabel>
          <div style={{ fontSize: 22, fontWeight: 620, letterSpacing: "-0.6px", marginBottom: 6 }}>{V.scenario.title}</div>
          <p style={{ fontSize: 13.5, color: "rgba(0,0,0,0.55)", lineHeight: 1.6, marginBottom: 16 }}>{V.scenario.summary}</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {V.scenario.scenes.map(sc => (
              <div key={sc.order} className="cc-row" role="button" tabIndex={0} onClick={() => seekTo(sc.s)}
                onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); seekTo(sc.s); } }}
                style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 12px", borderRadius: 10, border: "1px solid rgba(0,0,0,0.08)", cursor: "pointer" }}>
                <div style={{ width: 24, height: 24, borderRadius: "50%", background: accent, color: "#fff", fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{sc.order}</div>
                <img src={encSrc(sc.thumb)} alt="" loading="lazy" style={{ width: 96, height: 60, flexShrink: 0, borderRadius: 6, objectFit: "cover", background: "#111" }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 480, letterSpacing: "-0.1px", lineHeight: 1.45 }}>{sc.description}</div>
                  <div style={{ fontSize: 12, color: "rgba(0,0,0,0.5)", marginTop: 3, lineHeight: 1.45 }}>{sc.reason}</div>
                </div>
                <div style={{ fontSize: 11, fontFamily: "'DM Mono', 'Noto Sans KR', monospace", color: "rgba(0,0,0,0.5)", whiteSpace: "nowrap" }}>{fmtSec(sc.s)} – {fmtSec(sc.e)}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Sticky action bar */}
      <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, background: "rgba(255,255,255,0.94)", backdropFilter: "blur(8px)", borderTop: "1px solid rgba(0,0,0,0.08)", display: "flex", justifyContent: "center", padding: "14px 40px", zIndex: 20 }}>
        <div style={{ width: "100%", maxWidth: 960, display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 540, letterSpacing: "-0.2px" }}>
              {selected.size}개 선택 · 총 {fmtSec(totalSel)}
            </div>
            <div style={{ fontSize: 11.5, color: "rgba(0,0,0,0.45)" }}>
              {selected.size === 0 ? "편집할 구간을 하나 이상 선택해 주세요." : "선택한 구간은 시간 순서대로 이어 붙여요."}
            </div>
          </div>
          <PillBtn variant="white" icon="zap" small onClick={onRetry}>다시 추출</PillBtn>
          <PillBtn variant={selected.size ? "accent" : "glass"} icon="wand" onClick={selected.size ? onNext : undefined}
            style={{ opacity: selected.size ? 1 : 0.45, cursor: selected.size ? "pointer" : "not-allowed" }}>
            선택한 구간으로 편집 시작
          </PillBtn>
        </div>
      </div>
    </div>
  );
};

const noop = () => {};
const App = () => (
  <ThemeCtx.Provider value={TWEAK_DEFAULTS}>
    <HighlightResultScreen onBack={noop} onRetry={noop} onNext={noop} />
  </ThemeCtx.Provider>
);
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
