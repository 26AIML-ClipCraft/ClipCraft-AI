<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1680" viewBox="0 0 1500 1680" font-family="'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B4558"/></marker></defs><rect x="480" y="30" width="540" height="100" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="67.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Editing Scenario</text><text x="750.0" y="95.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">title, summary, scenes (chronological)</text><text x="750.0" y="117.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">each with a description and a reason</text><rect x="480" y="190" width="540" height="120" fill="#FCF3D3" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="237.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Scenario Recommendation (GPT)</text><text x="750.0" y="265.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">captions + times → JSON</text><text x="750.0" y="287.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">missing scenes dropped, sorted by time</text><polyline points="750,190 750,130" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="370" width="540" height="110" fill="#ECE8F8" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="412.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Segment Captions (GPT)</text><text x="750.0" y="440.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">what is visible in each segment,</text><text x="750.0" y="462.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">from its key frames</text><polyline points="750,370 750,310" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="540" width="540" height="120" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="587.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Key Frames</text><text x="750.0" y="615.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">≈ 1 per 8 s (2–5) + importance peak</text><text x="750.0" y="637.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">1024 px, detail = high</text><polyline points="750,540 750,480" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="720" width="540" height="130" fill="#FCF3D3" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="772.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">MMR Selection</text><text x="750.0" y="800.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">0.7 · importance − 0.3 · similarity to picked</text><text x="750.0" y="822.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">8 segments, returned in time order</text><polyline points="750,720 750,660" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="170" y="920" width="440" height="120" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="390.0" y="967.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Segment Importance (I)</text><text x="390.0" y="995.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">per W-s window: mean of the top</text><text x="390.0" y="1017.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">half of the saliency, rank-normalised</text><rect x="890" y="920" width="440" height="120" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="1110.0" y="967.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Segment Content Vector</text><text x="1110.0" y="995.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">per W-s window:</text><text x="1110.0" y="1017.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">mean of [ CLIP ; 0.5 · CLAP ]</text><polyline points="390,920 390,880 620,880 620,850" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="1110,920 1110,880 880,880 880,850" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="1110" width="360" height="120" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="240.0" y="1157.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Saliency Score (S)</text><text x="240.0" y="1185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">UniVTG saliency only</text><text x="240.0" y="1207.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">(no audio)</text><polyline points="260,1110 260,1040" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="1290" width="500" height="130" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="310.0" y="1342.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">UniVTG + Adapter</text><text x="310.0" y="1370.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">2-s pooling → Linear Adapter 768→512 →</text><text x="310.0" y="1392.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">frozen UniVTG saliency (cosine with title)</text><polyline points="260,1290 260,1230" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="1530" width="240" height="90" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="180.0" y="1573.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Video Title</text><text x="180.0" y="1601.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">file name</text><rect x="520" y="1530" width="280" height="90" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="660.0" y="1573.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Visual Features</text><text x="660.0" y="1601.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLIP ViT-L/14, 768-d</text><rect x="1060" y="1530" width="280" height="90" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="1200.0" y="1573.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Audio Features</text><text x="1200.0" y="1601.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLAP, 512-d</text><polyline points="180,1530 180,1420" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="660" cy="1480" r="4.5" fill="#3B4558"/><polyline points="660,1480 440,1480" fill="none" stroke="#3B4558" stroke-width="2.5"/><polyline points="440,1480 440,1420" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="660,1530 660,1480" fill="none" stroke="#3B4558" stroke-width="2.5"/><polyline points="660,1480 1050,1480 1050,1040" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="1200,1530 1200,1040" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><text x="750" y="1660" text-anchor="middle" font-size="16" fill="#4B566A">W = 12 s (video &lt; 6 min), 20 s (&lt; 20 min), 30 s (longer)</text></svg>