<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1830" viewBox="0 0 1500 1830" font-family="'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B4558"/></marker></defs><rect x="480" y="30" width="540" height="100" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="67.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Editing Scenario</text><text x="750.0" y="95.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">title, summary, scenes (chronological)</text><text x="750.0" y="117.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">each with a description and a reason</text><rect x="480" y="190" width="540" height="120" fill="#FCF3D3" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="237.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Scenario Recommendation (GPT)</text><text x="750.0" y="265.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">captions + times → JSON</text><text x="750.0" y="287.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">missing scenes dropped, sorted by time</text><polyline points="750,190 750,130" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="370" width="540" height="110" fill="#ECE8F8" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="412.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Segment Captions (GPT)</text><text x="750.0" y="440.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">what is visible in each segment,</text><text x="750.0" y="462.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">from its key frames</text><polyline points="750,370 750,310" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="540" width="540" height="120" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="587.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Key Frames</text><text x="750.0" y="615.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">≈ 1 per 8 s (2–5) + importance peak</text><text x="750.0" y="637.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">1024 px, detail = high</text><polyline points="750,540 750,480" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="720" width="540" height="130" fill="#FCF3D3" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="772.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">MMR Selection</text><text x="750.0" y="800.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">0.7 · importance − 0.3 · similarity to picked</text><text x="750.0" y="822.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">8 segments, returned in time order</text><polyline points="750,720 750,660" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="170" y="920" width="440" height="120" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="390.0" y="967.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Segment Importance (I)</text><text x="390.0" y="995.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">mean of the top half of f</text><text x="390.0" y="1017.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">inside the segment, rank-normalised</text><rect x="890" y="920" width="440" height="120" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="1110.0" y="967.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Segment Content Vector</text><text x="1110.0" y="995.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">mean of [ CLIP ; 0.5 · CLAP ]</text><text x="1110.0" y="1017.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">inside the segment</text><polyline points="390,920 390,880 620,880 620,850" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="1110,920 1110,880 880,880 880,850" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500" y="1110" width="500" height="130" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="1162.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Change-point Segmentation</text><text x="750.0" y="1190.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">novelty = 1 − cos(prev W s, next W s)</text><text x="750.0" y="1212.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">on [ CLIP ; 0.5 · CLAP ], 16 segments, ≥ 5 s</text><polyline points="900,1110 900,1075 1110,1075 1110,1040" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="600,1110 600,1075 500,1075 500,1040" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="1110" width="340" height="120" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="230.0" y="1157.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Foreground Score (f)</text><text x="230.0" y="1185.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">head output, summary uses</text><text x="230.0" y="1207.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">f only (no saliency, audio, motion)</text><polyline points="260,1110 260,1040" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="1310" width="560" height="350" rx="26" fill="#F0F7F0"/><text x="54" y="1346" text-anchor="start" font-size="22" font-weight="700" fill="#2F7D5B">AV-UniVTG Head</text><rect x="70" y="1360" width="480" height="110" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="310.0" y="1402.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Foreground Head</text><text x="310.0" y="1430.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">Transformer encoder over</text><text x="310.0" y="1452.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">visual + audio tokens and title query</text><polyline points="260,1360 260,1230" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="1710" width="240" height="90" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="180.0" y="1753.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Video Title</text><text x="180.0" y="1781.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">file name → CLIP text</text><rect x="520" y="1710" width="280" height="90" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="660.0" y="1753.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Visual Features</text><text x="660.0" y="1781.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLIP ViT-L/14, 768-d</text><rect x="880" y="1710" width="280" height="90" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="1020.0" y="1753.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Audio Features</text><text x="1020.0" y="1781.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLAP, 512-d</text><polyline points="180,1710 180,1470" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="620" cy="1580" r="4.5" fill="#3B4558"/><polyline points="620,1710 620,1580 400,1580" fill="none" stroke="#3B4558" stroke-width="2.5"/><polyline points="400,1580 400,1470" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="700,1710 700,1240" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="1020" cy="1625" r="4.5" fill="#3B4558"/><polyline points="1020,1710 1020,1625 480,1625" fill="none" stroke="#3B4558" stroke-width="2.5"/><polyline points="480,1625 480,1470" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="960,1710 960,1240" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/></svg>