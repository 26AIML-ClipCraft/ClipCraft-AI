<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1480" viewBox="0 0 1500 1480" font-family="'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B4558"/></marker></defs><rect x="550" y="30" width="400" height="100" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="67.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Highlight Clips</text><text x="750.0" y="95.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">greedy peak picking, 3–12 s each,</text><text x="750.0" y="117.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">gap ≥ 2 s, total ≈ 10 % (15–60 s)</text><rect x="575" y="190" width="350" height="70" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="223.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Highlight Score</text><text x="750.0" y="251.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">per second, 0–1</text><rect x="480" y="320" width="540" height="120" fill="#FCF3D3" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="367.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Weighted Late Fusion</text><text x="750.0" y="395.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">0.5 S + 0.3 A + 0.2 M</text><text x="750.0" y="417.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">each term rank-normalised, smoothed 3 s</text><polyline points="750,190 750,130" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="750,320 750,260" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="520" width="360" height="90" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="240.0" y="574.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Motion Score (M)</text><rect x="570" y="520" width="360" height="90" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="563.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Saliency Score (S)</text><text x="750.0" y="591.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">= saliency logit + foreground logit</text><rect x="1080" y="520" width="360" height="90" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="1260.0" y="574.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Audio Score (A)</text><polyline points="240,520 240,480 1260,480 1260,520" fill="none" stroke="#3B4558" stroke-width="2.5"/><circle cx="750" cy="480" r="4.5" fill="#3B4558"/><polyline points="750,520 750,440" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="700" width="360" height="110" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="240.0" y="742.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Visual Change</text><text x="240.0" y="770.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">1 − cosine to the</text><text x="240.0" y="792.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">previous second</text><polyline points="240,700 240,610" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1080" y="700" width="360" height="130" fill="#ECE8F8" stroke="#3B4558" stroke-width="2"/><text x="1260.0" y="741.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Audio Event Scoring</text><text x="1260.0" y="769.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLAP audio vs. text prompts, softmax</text><text x="1260.0" y="791.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">laughter 1 · applause 1 · music .6</text><text x="1260.0" y="813.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">speech .5 · ambient .1 · silence −.5</text><polyline points="1260,700 1260,610" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="470" y="660" width="560" height="640" rx="26" fill="#F0F7F0"/><text x="494" y="696" text-anchor="start" font-size="22" font-weight="700" fill="#2F7D5B">AV-UniVTG Head</text><rect x="530" y="710" width="440" height="90" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="753.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Saliency Head + Foreground Head</text><text x="750.0" y="781.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">two MLPs, raw logits added</text><polyline points="750,710 750,610" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="530" y="860" width="440" height="110" fill="#ECE8F8" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="902.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Transformer Encoder</text><text x="750.0" y="930.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">3 layers, d = 256, 4 heads</text><text x="750.0" y="952.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">[ query token | 1-s video tokens ]</text><polyline points="750,860 750,800" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="500" y="1060" width="270" height="130" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="635.0" y="1101.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">AV Fusion</text><text x="635.0" y="1129.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">project CLIP + CLAP,</text><text x="635.0" y="1151.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">concat → MLP,</text><text x="635.0" y="1173.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">+ positional enc.</text><rect x="790" y="1060" width="210" height="130" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="895.0" y="1112.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Query Proj.</text><text x="895.0" y="1140.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">title text</text><text x="895.0" y="1162.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">embedding</text><polyline points="635,1060 635,970" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="895,1060 895,970" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="60" y="1330" width="360" height="100" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="240.0" y="1378.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Visual Features</text><text x="240.0" y="1406.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLIP ViT-L/14, 768-d, 1 fps</text><rect x="1080" y="1330" width="360" height="100" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="1260.0" y="1378.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Audio Features</text><text x="1260.0" y="1406.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLAP, 512-d, 1 s</text><rect x="720" y="1330" width="280" height="100" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="860.0" y="1378.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Video Title</text><text x="860.0" y="1406.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">file name → CLIP text</text><polyline points="240,1330 240,810" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="1260,1330 1260,830" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="895,1330 895,1190" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="240" cy="1250" r="4.5" fill="#3B4558"/><polyline points="240,1250 580,1250" fill="none" stroke="#3B4558" stroke-width="2.5"/><polyline points="580,1250 580,1190" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="1260" cy="1280" r="4.5" fill="#3B4558"/><polyline points="1260,1280 690,1280" fill="none" stroke="#3B4558" stroke-width="2.5"/><polyline points="690,1280 690,1190" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/></svg>