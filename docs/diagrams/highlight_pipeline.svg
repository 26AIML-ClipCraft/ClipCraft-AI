<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1570" viewBox="0 0 1500 1570" font-family="'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B4558"/></marker></defs><text x="750" y="1535" text-anchor="middle" font-size="16" fill="#4B566A">W = 12 s (&lt; 6 min), 20 s (&lt; 20 min), 30 s (longer): the longest a clip may grow (same value as the summary window)</text><rect x="550" y="30" width="400" height="100" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="67.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Highlight Clips</text><text x="750.0" y="95.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">greedy peak picking, 3 s up to window W,</text><text x="750.0" y="117.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">gap ≥ 2 s, total ≈ 10 % (15–60 s)</text><rect x="575" y="190" width="350" height="70" fill="#ffffff" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="223.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Highlight Score</text><text x="750.0" y="251.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">per second, 0–1</text><rect x="480" y="320" width="540" height="120" fill="#FCF3D3" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="367.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Weighted Late Fusion</text><text x="750.0" y="395.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">0.7 S + 0.3 A</text><text x="750.0" y="417.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">each term rank-normalised, smoothed 3 s</text><polyline points="750,190 750,130" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="750,320 750,260" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="570" y="520" width="360" height="90" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="563.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Saliency Score (S)</text><text x="750.0" y="591.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">UniVTG saliency (clip repeated to 1 s)</text><rect x="1080" y="520" width="360" height="90" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="1260.0" y="574.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Audio Score (A)</text><polyline points="1260,520 1260,480 750,480" fill="none" stroke="#3B4558" stroke-width="2.5"/><circle cx="750" cy="480" r="4.5" fill="#3B4558"/><polyline points="750,520 750,440" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1080" y="700" width="360" height="130" fill="#ECE8F8" stroke="#3B4558" stroke-width="2"/><text x="1260.0" y="741.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Audio Event Scoring</text><text x="1260.0" y="769.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">CLAP audio vs. text prompts, softmax</text><text x="1260.0" y="791.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">laughter 1 · applause 1 · music .6</text><text x="1260.0" y="813.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">speech .5 · ambient .1 · silence −.5</text><polyline points="1260,700 1260,610" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="440" y="650" width="620" height="660" rx="26" fill="#F0F7F0"/><text x="1036" y="686" text-anchor="end" font-size="22" font-weight="700" fill="#2F7D5B">UniVTG Saliency Branch</text><rect x="520" y="710" width="460" height="90" fill="#E3F1EA" stroke="#3B4558" stroke-width="2"/><text x="750.0" y="753.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Similarity Score</text><text x="750.0" y="781.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">cosine(video token, pooled query)</text><polyline points="750,710 750,610" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="870" width="220" height="90" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="590.0" y="913.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Feed Forward</text><text x="590.0" y="941.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">frozen</text><rect x="800" y="870" width="220" height="90" fill="#ECE8F8" stroke="#3B4558" stroke-width="2"/><text x="910.0" y="913.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Att. Pooler</text><text x="910.0" y="941.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">frozen</text><polyline points="590,870 590,800" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="910,870 910,800" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="1030" width="220" height="100" fill="#FBEBDD" stroke="#3B4558" stroke-width="2"/><text x="590.0" y="1078.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Linear Adapter</text><text x="590.0" y="1106.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">768 → 512 (trained)</text><rect x="800" y="1030" width="220" height="100" fill="#E6EEF9" stroke="#3B4558" stroke-width="2"/><text x="910.0" y="1078.0" text-anchor="middle" font-size="23" font-weight="700" fill="#2F3A4C">Feed Forward</text><text x="910.0" y="1106.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4B566A">frozen</text><polyline points="590,1030 590,960" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#ah)"/><polyline points="910,1030 910,960" fill="none" stroke="#3B4558" stroke-width="2.5" marker-end="url(#a